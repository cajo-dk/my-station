name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Compile Python
        run: python -m compileall -q custom_components
      - name: Test dashboard resource registration
        run: python tests/test_resource_registration.py
      - name: Check card syntax
        run: node --check custom_cards/my-station-card/my-station-card.js
      - name: Verify packaged card
        run: cmp custom_cards/my-station-card/my-station-card.js custom_components/my_station/frontend/my-station-card.js
